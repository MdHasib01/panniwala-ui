# Netlify detects Next.js and builds it with its Next.js runtime (OpenNext adapter),
# which serves the pages, image optimisation and routing — no SPA redirect needed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Public URL of the Express API (inlined into the client bundle at build time).
  NEXT_PUBLIC_API_URL = "https://paniwalaapi.hasibdev.online"
